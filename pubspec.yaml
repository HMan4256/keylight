name: keylight
description: "A visual piano practice studio with on-device live note detection."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.14.0

dependencies:
  flutter:
    sdk: flutter
  flutter_midi_command: ^1.4.0
  flutter_midi_command_ble: ^1.4.0
  flutter_soloud: ^5.3.1
  material_ui: ^1.1.0
  record: ^7.2.0
  tflite_flutter: ^0.12.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_midi_command_platform_interface: ^1.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/piano_onsets_frames.tflite
    - assets/models/MAGENTA_LICENSE
    - assets/fonts/OFL.txt
    - assets/fonts/Pixelify-OFL.txt
  fonts:
    - family: Pixelify
      fonts:
        - asset: assets/fonts/PixelifySans.ttf
    - family: TheorySymbols
      fonts:
        - asset: assets/fonts/NotoMusic-Regular.ttf

hooks:
  user_defines:
    flutter_soloud:
      no_xiph_libs: true
